<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회사소개 - (주)노느니 교육</title>
    <!-- [추가] 가장 트렌디하고 가독성 높은 프리텐다드 웹 폰트 로드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        /* 기본 설정 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* 폰트를 프리텐다드로 변경하여 훨씬 세련된 느낌 부여 */
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #333; line-height: 1.6; background-color: #f8f9fa; }
        a { text-decoration: none; color: inherit; }
        ul, li { list-style: none; }

        /* 상단 네비게이션 바 (스크롤 시 상단 고정 및 유리 블러 효과 적용) */
        header { 
            background-color: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 40px; 
            border-bottom: 1px solid rgba(0,0,0,0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .logo img { height: 48px; width: auto; display: block; }
        
        .nav-menu { display: flex; gap: 35px; font-weight: 600; color: #495057; align-items: center; font-size: 15px; }
        .nav-menu a { transition: color 0.2s ease; }
        .nav-menu a:hover { color: #ff6b6b; }

        /* 메인 히어로 섹션 (요즘 유행하는 부드럽고 세련된 파스텔 그라데이션) */
        .hero-section { 
            background: linear-gradient(135deg, #fff0f0 0%, #ffe3e3 100%); 
            padding: 100px 20px 90px; 
            text-align: center; 
        }
        .hero-section h2 { font-size: 42px; font-weight: 800; color: #1e293b; margin-bottom: 20px; letter-spacing: -1px; }
        .hero-section p { font-size: 19px; color: #475569; font-weight: 500; }

        /* 회사 비전 섹션 */
        .vision-section { max-width: 800px; margin: 80px auto; text-align: center; padding: 0 20px; }
        .vision-section h3 { font-size: 30px; font-weight: 800; color: #1e293b; margin-bottom: 24px; letter-spacing: -0.5px; }
        .vision-section p { font-size: 17px; color: #64748b; line-height: 1.8; word-break: keep-all; font-weight: 400; }

        /* 서비스 소개 섹션 */
        .service-section { max-width: 1100px; margin: 0 auto 100px; padding: 0 20px; }
        .service-title { text-align: center; font-size: 30px; font-weight: 800; margin-bottom: 50px; color: #1e293b; letter-spacing: -0.5px; }
        
        /* [핵심] 최신 CSS Grid 레이아웃으로 모바일/PC 완벽 대응 및 깔끔한 2열/4열/5열 배치 */
        .card-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 30px; 
        }
        
        /* 카드 디자인 고도화 (애플/토스 스타일) */
        .service-card {
            background-color: #fff;
            border-radius: 24px; /* 더 둥글고 세련된 모서리 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); /* 그림자를 훨씬 부드럽게 */
            padding: 45px 30px;
            text-align: center;
            height: 100%;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid rgba(0,0,0,0.02);
            position: relative;
        }
        /* 마우스 오버 시 우아하게 떠오르는 효과 */
        .service-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); 
        }
        
        .card-icon { font-size: 52px; margin-bottom: 24px; line-height: 1; }
        .card-title { font-size: 22px; color: #1e293b; margin-bottom: 16px; font-weight: 700; letter-spacing: -0.5px; }
        .card-desc { font-size: 15px; color: #64748b; line-height: 1.6; font-weight: 400; word-break: keep-all; }

        /* 화상영어/바이브코딩 하이라이트 */
        .highlight-card {
            border: 2px solid #ff6b6b;
            background: linear-gradient(to bottom, #ffffff, #fffafa);
        }
        .vibe-card {
            border: 2px solid #6b8cff;
            background: linear-gradient(to bottom, #ffffff, #f5f8ff);
        }
        .new-badge {
            position: absolute; 
            top: -14px; 
            right: 24px; 
            background: #ff6b6b; 
            color: white; 
            padding: 5px 14px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 700; 
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
            letter-spacing: 0.5px;
        }
        .vibe-badge {
            background: #6b8cff;
            box-shadow: 0 4px 10px rgba(107, 140, 255, 0.3);
        }

        /* 하단 푸터 (깔끔하게 정돈) */
        footer { background-color: #f1f5f9; border-top: 1px solid #e2e8f0; padding: 60px 20px; font-size: 13px; color: #64748b; }
        .footer-inner { max-width: 1100px; margin: 0 auto; }
        .footer-inner h1 { font-size: 20px; color: #334155; margin-bottom: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .footer-content { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 30px; }
        .company-info p { margin-bottom: 10px; line-height: 1.5; }
        .company-info span { margin-right: 18px; display: inline-block; }
