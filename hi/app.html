<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 영어 튜터 (왕초보 스몰토크)</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Nunito', 'Noto Sans KR', sans-serif; 
            background-color: #fff9ec; 
            margin: 0; 
            padding: 20px 10px; 
            color: #4a4a4a; 
        } 
        .container { max-width: 500px; margin: 0 auto; position: relative; }
        h2 { 
            text-align: center; color: #d35400; font-weight: 700; font-size: 26px; 
            margin-bottom: 25px; text-shadow: 1px 1px 2px rgba(211, 84, 0, 0.1);
        }
        .section-box { 
            background: white; padding: 25px 20px; border-radius: 24px; 
            box-shadow: 0 10px 25px rgba(255, 177, 66, 0.15); margin-bottom: 25px; 
        }
        h3 { margin-top: 0; color: #e15f41; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }

        .input-group { margin-bottom: 18px; }
        .input-group label { font-weight: 700; color: #57606f; font-size: 14px; margin-bottom: 8px; display: block; }
        select, input[type="text"], input[type="password"] { 
            width: 100%; padding: 14px; border: 2px solid #ffeaa7; border-radius: 16px; 
            box-sizing: border-box; font-size: 15px; font-family: inherit;
            transition: all 0.3s; outline: none; background-color: #fffdf7;
        }
        select:focus, input[type="text"]:focus, input[type="password"]:focus { 
            border-color: #ffda79; background-color: #fff;
        }

        button { 
            font-family: inherit; border: none; border-radius: 18px; cursor: pointer; 
            font-size: 16px; font-weight: 700; width: 100%; transition: all 0.2s ease; box-sizing: border-box;
        }
        button:active { transform: scale(0.96); }

        .btn-main { 
            background: linear-gradient(135deg, #ffd32a, #ffa801); color: white; padding: 16px; 
            box-shadow: 0 6px 15px rgba(255, 168, 1, 0.3); text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }
        .btn-main:hover { box-shadow: 0 8px 20px rgba(255, 168, 1, 0.4); transform: translateY(-3px); }

        #loading { display: none; margin-top: 20px; color: #ff9f43; text-align: center; font-weight: 700; font-size: 15px; }
        #scriptResult { 
            margin-top: 20px; padding: 18px; background-color: #f1f2f6; border-radius: 16px; 
            border-left: 5px solid #ffda79; white-space: pre-wrap; line-height: 1.7; display: none; font-size: 15px;
        }
        #scriptResult b { color: #e15f41; font-size: 16px; background-color: #ffeaa7; padding: 2px 6px; border-radius: 6px; }

        #chatSection { display: none; margin-top: 30px; }
        .chat-box { 
            background-color: #f8efd4; border-radius: 20px; padding: 20px 15px; height: 400px; 
            overflow-y: auto; display: flex; flex-direction: column; gap: 16px; 
            margin-bottom: 10px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
        }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 75%; line-height: 1.5; font-size: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .teacher-msg { background-color: #ffffff; align-self: flex-start; border-bottom-left-radius: 4px; color: #4a4a4a; }
        .student-msg-wrapper { display: flex; flex-direction: column; align-items: flex-end; width: 100%; margin-bottom: 10px; }
        .student-msg { background-color: #fff3cd; align-self: flex-end; border-bottom-right-radius: 4px; color: #4a4a4a; width: 100%; box-sizing: border-box; }

        .blurred-text { filter: blur(5px); transition: filter 0.3s ease; user-select: none; }
        .msg-controls, .student-controls { display: flex; gap: 8px; margin-top: 6px; margin-bottom: 4px; }
        .msg-controls button, .student-controls button {
            padding: 0; font-size: 16px; border-radius: 50%; background-color: #ffffff; color: #4a4a4a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06); width: 36px; height: 36px; border: none; 
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .msg-controls button:hover, .student-controls button:hover { background-color: #ffeaa7; transform: translateY(-2px); }
        .student-controls button.active { background-color: #78e08f; color: white; border-color: #78e08f; }

        .btn-start-chat { background: linear-gradient(135deg, #78e08f, #38ada9); color: white; padding: 16px; margin-top: 20px; box-shadow: 0 6px 15px rgba(120, 224, 143, 0.3); text-shadow: 1px 1px 1px rgba(0,0,0,0.1); }
        .btn-start-chat:hover { box-shadow: 0 8px 20px rgba(120, 224, 143, 0.4); transform: translateY(-3px); }
        .btn-restart { background-color: #f1f2f6; color: #57606f; padding: 12px; margin-bottom: 15px; font-size: 14px; }
        .btn-reset-key { background-color: transparent; color: #a4b0be; border: 1px solid #a4b0be; padding: 6px 12px; border-radius: 20px; font-size: 12px; width: auto; font-weight: normal; }
        .btn-reset-key:hover { background-color: #ff7f50; color: white; border-color: #ff7f50; }

        .chat-input-area { background-color: white; padding: 12px; border-radius: 20px; box-shadow: 0 4px 15px rgba(255, 177, 66, 0.1); margin-bottom: 15px; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        .input-row textarea {
            flex-grow: 1; padding: 12px 14px; border: 2px solid #f1f2f6; border-radius: 16px;
            background-color: #fafbfc; margin: 0; width: auto; resize: none; min-height: 48px; max-height: 120px;
            font-family: inherit; font-size: 15px; line-height: 1.5; overflow-y: auto; box-sizing: border-box; outline: none; transition: all 0.3s;
        }
        .input-row textarea:focus { border-color: #78e08f; background-color: #fff; }

        .btn-mic {
            background-color: #ffc048; color: white; border: none; border-radius: 50%; width: 48px; height: 48px;
            font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 192, 72, 0.3);
            flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; user-select: none; -webkit-user-select: none;
        }
        
        .btn-send-msg {
            background-color: #78e08f; color: white; border: none; border-radius: 50%; width: 48px; height: 48px;
            font-size: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(120, 224, 143, 0.3); flex-shrink: 0;
        }
        .btn-send-msg:hover { background-color: #38ada9; transform: translateY(-2px); }

        .tip-container {
            display: none; background-color: #f6fff8; border-left: 4px solid #78e08f; padding: 14px;
            border-radius: 12px 0 12px 12px; font-size: 14px; margin-top: 4px; max-width: 85%;
            color: #4a4a4a; box-shadow: 0 4px 12px rgba(120, 224, 143, 0.15); line-height: 1.5; text-align: left;
        }
        .tip-container.show { display: block; animation: slideDown 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .heart-container { text-align: center; margin-bottom: 12px; }
        .heart-status {
            display: inline-block; background-color: #ff7675; color: white; font-weight: 700;
            font-size: 15px; padding: 8px 18px; border-radius: 20px; box-shadow: 0 4px 10px rgba(255, 118, 117, 0.3); transition: transform 0.2s;
        }

        .footer-info { text-align: center; font-size: 12px; color: #ced6e0; margin-top: 40px; margin-bottom: 10px; font-family: 'Nunito', sans-serif; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 24px; max-width: 400px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.15); position: relative; line-height: 1.6; font-size: 15px; color: #4a4a4a; text-align: center; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: #f1f2f6; border: none; font-size: 14px; cursor: pointer; color: #57606f; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: #ff7675; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>💡 AI 튜터와 영어 스몰토크</h2>

    <!-- [0단계] API 키 및 상품 설정 -->
    <div class="section-box" id="step0">
        <h3 style="justify-content: flex-start;">🔑 초기 설정 (1회만 진행)</h3>
        <p style="font-size: 13px; color: #636e72; margin-top: -5px; margin-bottom: 20px;">사용자의 기기에 안전하게 저장됩니다. (서버 전송 X)</p>
        
        <div class="input-group">
            <input type="text" id="studentNameInput" placeholder="사용하실 영어 이름 (예: Alex)">
        </div>
        <div class="input-group">
            <input type="password" id="apiKeyInput" placeholder="구글 Gemini API 키를 입력하세요">
        </div>
        <div class="input-group">
            <input type="password" id="openAiKeyInput" placeholder="OpenAI Whisper API 키를 입력하세요 (선택)">
        </div>
        
        <div class="input-group">
            <label for="planSelect">💳 이용권 (하루 대화 가능 횟수)</label>
            <select id="planSelect">
                <option value="20">베이직 플랜 (하루 20회)</option>
                <option value="50">스탠다드 플랜 (하루 50회)</option>
                <option value="100">프리미엄 플랜 (하루 100회)</option>
            </select>
        </div>

        <button class="btn-main" onclick="saveApiKey()">✅ 저장하고 시작하기</button>
    </div>
    
    <!-- [1단계] 대본 생성 -->
    <div class="section-box" id="step1" style="display: none;">
        <h3>1단계: 대화 준비 📝 
            <button class="btn-reset-key" onclick="resetApiKey()">설정 초기화</button>
        </h3>
        
        <div class="input-group" style="margin-top: 15px;">
            <label for="voiceSelect">🗣️ 튜터 목소리 선택</label>
            <select id="voiceSelect" onchange="playSampleVoice()"></select>
        </div>
    
        <div class="input-group">
            <label for="userInput">💬 대화 주제 (또는 관심사)</label>
            <input type="text" id="userInput" placeholder="예: 주말에 본 영화 / 카페에 다녀온 일">
        </div>
        <button class="btn-main" onclick="generateScript()">✨ 맞춤형 대본 생성하기</button>
        
        <button class="btn-start-chat" style="display: block; margin-top: 12px;" onclick="skipScriptAndChat()">🚀 대본 없이 프리토킹 시작</button>
        
        <div id="loading">대본을 생성 중입니다... ⏳</div>
        <div id="scriptResult"></div>
        
        <button id="startChatBtn" class="btn-start-chat" style="display: none;" onclick="openChatSection('script')">🎤 실전 채팅 시작하기 ▶️</button>
    </div>

    <!-- [2단계] 실전 대화 (채팅형) -->
    <div class="section-box" id="chatSection">
        <h3>2단계: AI 튜터와 회화 연습 🗣️</h3>
        <button class="btn-restart" onclick="restartConversation()">🔄 대화 다시 시작하기</button>
        
        <div class="heart-container">
            <div id="heartStatus" class="heart-status">❤️ 20 / 20</div>
        </div>

        <div class="chat-box" id="chatBox"></div>
        
        <div class="chat-input-area">
            <div class="input-row">
                <textarea id="studentChatInput" placeholder="여기에 영어로 답변을 작성해주세요!" maxlength="150" onkeydown="handleEnter(event)" oninput="autoResize(this)"></textarea>
                <button id="micBtn" class="btn-mic" title="누르고 말하기">🎤</button>
                <button class="btn-send-msg" id="sendBtn" onclick="sendChatMessage()" title="전송">✈️</button>
            </div>
        </div>
    </div>
    
    <div class="footer-info">
        v2.5.0 | AI English Tutor. All rights reserved.
    </div>
</div> 

<!-- 힌트 팝업 모달 레이어 -->
<div id="hintModal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close" onclick="closeHintModal()">✖</button>
        <div id="hintModalBody">⏳ 의미 파악 및 추천 답변 생성 중...</div>
    </div>
</div>

<script>
    // --- 설정 변수 ---
    let USER_API_KEY = ""; 
    let OPENAI_API_KEY = ""; 
    let STUDENT_NAME = ""; 
    let currentUserInput = ""; 
    let chatHistory = []; 
    let availableVoices = []; 
    let currentChatMode = 'script'; 
    
    let USER_PLAN = 20; 
    let CURRENT_HEARTS = 20;

    // --- 마이크(Whisper) 변수 ---
    let mediaRecorder;
    let audioChunks = [];

    window.onload = function() {
        const savedKey = localStorage.getItem("gemini_tutor_api_key");
        const savedOpenAiKey = localStorage.getItem("gemini_tutor_openai_key");
        const savedName = localStorage.getItem("gemini_tutor_student_name");
        
        if (savedKey && savedName && savedOpenAiKey) {
            USER_API_KEY = savedKey;
            OPENAI_API_KEY = savedOpenAiKey;
            STUDENT_NAME = savedName;
            checkAndResetHearts(); 
            document.getElementById('step0').style.display = "none"; 
            document.getElementById('step1').style.display = "block"; 
        }

        // 마이크 이벤트 등록 (PC/Mobile)
        const micBtn = document.getElementById('micBtn');
        micBtn.addEventListener('mousedown', startRecording);
        micBtn.addEventListener('mouseup', stopRecording);
        micBtn.addEventListener('mouseleave', stopRecording);
        micBtn.addEventListener('touchstart', startRecording, {passive: true});
        micBtn.addEventListener('touchend', stopRecording);
    };

    // ==========================================
    // 🎤 마이크 & Whisper API
    // ==========================================
    async function startRecording(e) {
        if(e.type === 'mousedown' && e.button !== 0) return; 
        const micBtn = document.getElementById('micBtn');
        const inputEl = document.getElementById('studentChatInput');
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => { audioChunks.push(event.data); };
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                await sendToWhisper(audioBlob);
            };

            mediaRecorder.start();
            micBtn.style.backgroundColor = "#ff7675"; // 녹음 중 빨간색
            inputEl.placeholder = "🎙️ 듣고 있어요... (손을 떼면 전송)";
        } catch (err) {
            alert("마이크 사용 권한을 허용해주세요!");
        }
    }

    function stopRecording(e) {
        if(mediaRecorder && mediaRecorder.state === "recording") {
            const micBtn = document.getElementById('micBtn');
            const inputEl = document.getElementById('studentChatInput');
            
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            micBtn.style.backgroundColor = "#ffc048"; // 원래 피치색
            inputEl.placeholder = "⏳ 목소리를 문자로 변환 중입니다...";
        }
    }

    async function sendToWhisper(audioBlob) {
        const inputEl = document.getElementById('studentChatInput');
        const formData = new FormData();
        formData.append("file", audioBlob, "voice.webm");
        formData.append("model", "whisper-1"); 
        formData.append("language", "en"); 

        try {
            const response = await fetch("https://api.openai.com/v1/audio/transcriptions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${OPENAI_API_KEY}` },
                body: formData
            });

            const data = await response.json();
            
            if (data.text) {
                inputEl.value = data.text;
                sendChatMessage(); 
            } else {
                throw new Error(data.error?.message || "변환 실패");
            }
        } catch (error) {
            alert("음성 인식 중 오류가 발생했습니다.");
            inputEl.placeholder = "여기에 영어로 답변을 작성해주세요!";
        }
    }

    // ==========================================
    // ❤️ 하트 관리 및 기본 설정 로직
    // ==========================================
    function checkAndResetHearts() {
        const savedPlan = localStorage.getItem("gemini_tutor_plan");
        if (savedPlan) USER_PLAN = parseInt(savedPlan);
        
        const today = new Date().toDateString();
        const lastDate = localStorage.getItem("gemini_tutor_last_date");
        
        if (lastDate !== today) {
            CURRENT_HEARTS = USER_PLAN;
            localStorage.setItem("gemini_tutor_last_date", today);
            localStorage.setItem("gemini_tutor_hearts", CURRENT_HEARTS);
        } else {
            const savedHearts = localStorage.getItem("gemini_tutor_hearts");
            CURRENT_HEARTS = savedHearts !== null ? parseInt(savedHearts) : USER_PLAN;
        }
        updateHeartUI();
    }

    function updateHeartUI() {
        const heartEl = document.getElementById('heartStatus');
        if(heartEl) heartEl.innerText = `❤️ ${CURRENT_HEARTS} / ${USER_PLAN}`;
        
        const inputEl = document.getElementById('studentChatInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        
        if (CURRENT_HEARTS <= 0) {
            if(inputEl) {
                inputEl.disabled = true;
                inputEl.placeholder = "오늘의 한도를 소진했습니다. 내일 다시 만나요!";
                inputEl.style.backgroundColor = "#e2e8f0";
            }
            if(sendBtn) { sendBtn.disabled = true; sendBtn.style.backgroundColor = "#b2bec3"; }
            if(micBtn) { micBtn.disabled = true; micBtn.style.opacity = "0.5"; }
            if(heartEl) { heartEl.style.backgroundColor = "#e2e8f0"; heartEl.style.color = "#b2bec3"; }
        } else {
            if(inputEl) {
                inputEl.disabled = false;
                inputEl.placeholder = "여기에 영어로 답변을 작성해주세요!";
                inputEl.style.backgroundColor = "#fafbfc";
            }
            if(sendBtn) { sendBtn.disabled = false; sendBtn.style.backgroundColor = "#78e08f"; }
            if(micBtn) { micBtn.disabled = false; micBtn.style.opacity = "1"; }
            if(heartEl) { heartEl.style.backgroundColor = "#ff7675"; heartEl.style.color = "white"; }
        }
    }

    function saveApiKey() {
        const inputName = document.getElementById('studentNameInput').value.trim();
        const inputKey = document.getElementById('apiKeyInput').value.trim();
        const inputOpenAiKey = document.getElementById('openAiKeyInput').value.trim();
        
        if (!inputName) { alert("이름을 입력해주세요!"); return; }
        if (!inputKey) { alert("구글 API 키를 입력해주세요!"); return; }
        if (!inputOpenAiKey) { alert("OpenAI API 키를 입력해주세요!"); return; }
        
        USER_API_KEY = inputKey;
        OPENAI_API_KEY = inputOpenAiKey;
        STUDENT_NAME = inputName;
        
        const planValue = document.getElementById('planSelect').value;
        localStorage.setItem("gemini_tutor_plan", planValue);
        localStorage.setItem("gemini_tutor_api_key", USER_API_KEY); 
        localStorage.setItem("gemini_tutor_openai_key", OPENAI_API_KEY);
        localStorage.setItem("gemini_tutor_student_name", STUDENT_NAME); 
        
        checkAndResetHearts();
        document.getElementById('step0').style.display = "none";
        document.getElementById('step1').style.display = "block";
    }
    
    function resetApiKey() {
        if(confirm("설정된 정보를 삭제하시겠습니까?")) {
            localStorage.clear();
            location.reload();
        }
    }
    
    function getModelUrl() {
        return "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=" + USER_API_KEY;
    }

    // ==========================================
    // 🗣️ TTS (텍스트 음성 변환) 로직
    // ==========================================
    function populateVoiceList() {
        availableVoices = window.speechSynthesis.getVoices();
        const voiceSelect = document.getElementById('voiceSelect');
        const currentValue = voiceSelect.value;
        voiceSelect.innerHTML = ''; 
        
        const usEnglishVoices = availableVoices.filter(voice => voice.lang.includes('en-US') || voice.lang.includes('en_US'));
        usEnglishVoices.forEach((voice) => {
            const option = document.createElement('option');
            let cleanName = voice.name.replace('Microsoft ', '').replace('Google ', '');
            option.textContent = `${cleanName} (${voice.lang})`;
            option.value = voice.name;
            voiceSelect.appendChild(option);
        });
        
        if (usEnglishVoices.length === 0) voiceSelect.innerHTML = '<option>영어 목소리를 찾을 수 없습니다.</option>';
        else if (currentValue) voiceSelect.value = currentValue; 
    }
    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoiceList;
    
    function playSampleVoice() {
        if(!window.speechSynthesis) return;
        window.speechSynthesis.cancel(); 
        const utterance = new SpeechSynthesisUtterance("Hello! How do I sound?");
        const selectedVoice = availableVoices.find(voice => voice.name === document.getElementById('voiceSelect').value);
        if (selectedVoice) utterance.voice = selectedVoice;
        else utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
    
    function replayText(text) {
        if(!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        let cleanText = text.replace(/<[^>]*>?/gm, ''); 
        cleanText = cleanText.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        const selectedVoice = availableVoices.find(voice => voice.name === document.getElementById('voiceSelect').value);
        if (selectedVoice) utterance.voice = selectedVoice;
        else utterance.lang = 'en-US'; 
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
    
    function speakText(text) {
        if(!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        let cleanText = text.replace(/<[^>]*>?/gm, '');
        cleanText = cleanText.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        const selectedVoice = availableVoices.find(voice => voice.name === document.getElementById('voiceSelect').value);
        if (selectedVoice) utterance.voice = selectedVoice;
        else utterance.lang = 'en-US'; 
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // 📝 대본 생성 및 대화 시작 로직
    // ==========================================
    async function generateScript() {
        const userInput = document.getElementById('userInput').value;
        if (!userInput.trim()) { alert("대화 주제를 입력해주세요!"); return; }
        currentUserInput = userInput; 
        document.getElementById('scriptResult').style.display = "none";
        document.getElementById('startChatBtn').style.display = "none";
        document.getElementById('loading').style.display = "block";
        document.getElementById('chatSection').style.display = "none"; 
        
        const promptText = `다음은 영어 회화 초보자인 '${STUDENT_NAME}'이(가) AI 영어 튜터와 나눌 스몰토크 대본입니다.
        ※ 규칙 1: '영어 문장'은 반드시 <b> 태그로 감싸주세요.
        ※ 규칙 2: 발음은 적지 마세요.
        
        [작성 순서 및 양식]
        1. 튜터의 첫 질문("Hi ${STUDENT_NAME}! How was~?")에 대한 사용자의 대답
        2. 튜터의 예상 꼬리 질문 2가지
        3. 꼬리 질문에 대한 사용자 대답 2개
        4. 튜터에게 되묻는 질문 1개
        오늘 대화 주제: ${userInput}`;
        
        try {
            const response = await fetch(getModelUrl(), {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            document.getElementById('scriptResult').innerHTML = data.candidates[0].content.parts[0].text;
            document.getElementById('scriptResult').style.display = "block";
            document.getElementById('startChatBtn').style.display = "block";
        } catch (error) {
            document.getElementById('scriptResult').innerHTML = "오류가 발생했습니다: " + error.message;
            document.getElementById('scriptResult').style.display = "block";
        } finally {
            document.getElementById('loading').style.display = "none";
        }
    }
    
    function skipScriptAndChat() {
        currentUserInput = document.getElementById('userInput').value.trim();
        document.getElementById('scriptResult').style.display = "none";
        document.getElementById('startChatBtn').style.display = "none";
        openChatSection('free');
    }
    
    function openChatSection(mode) {
        currentChatMode = mode;
        document.getElementById('chatSection').style.display = "block";
        setTimeout(() => { document.getElementById('chatSection').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        restartConversation(mode); 
    }
    
    async function restartConversation(mode = currentChatMode) {
        checkAndResetHearts(); 
        if(window.speechSynthesis) window.speechSynthesis.cancel();
        
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = "<div id='chatLoading' style='text-align:center; color:#ff9f43; margin:30px 0; font-weight:bold;'>🤖 튜터가 인사를 준비하고 있습니다... ⏳</div>";
        
        const inputEl = document.getElementById('studentChatInput');
        inputEl.value = "";
        if(!inputEl.disabled) inputEl.style.height = '48px'; 
        
        let systemPrompt = "";
        
        if (mode === 'script') {
            systemPrompt = `너는 영어 회화 왕초보인 '${STUDENT_NAME}'을(를) 돕는 친절하고 인내심 많은 AI 영어 튜터야. 오늘 주제는 '${currentUserInput}'이야. 첫 인사로 무조건 'Hi ${STUDENT_NAME}! How was your day?'라고 말해. [중요 규칙]: 사용자가 문법을 틀리거나 어색한 영어를 쓰거나 한국어로 말하면, 자연스러운 영어 문장으로 고쳐주며 'Can you say [올바른 문장]?' 하고 부드럽게 따라 말하도록 유도해. 사용자가 잘 따라했다면 칭찬해주고 다음 질문을 해. 항상 아주 쉽고 간단한 1~2문장으로 말해.`;
            chatHistory = [
                { "role": "user", "parts": [{ "text": systemPrompt }] },
                { "role": "model", "parts": [{ "text": `Hi ${STUDENT_NAME}! How was your day?` }] }
            ];
            document.getElementById('chatLoading').remove();
            addTeacherMessage(`Hi ${STUDENT_NAME}! How was your day?`);
            speakText(`Hi ${STUDENT_NAME}! How was your day?`);
        } else {
            if (currentUserInput !== "") {
                systemPrompt = `너는 영어 회화 왕초보인 '${STUDENT_NAME}'을(를) 돕는 친절한 AI 영어 튜터야. 오늘 대화할 주제는 '${currentUserInput}'이야. 이 주제에 대해 먼저 친근하게 질문하면서 대화를 시작해. [중요 규칙]: 사용자가 어색한 영어나 한국어를 쓰면 자연스러운 영어로 고쳐주며 'Can you say [올바른 문장]?' 하고 따라 말하도록 유도해. 항상 아주 쉽고 간단한 1~2문장으로 대답해.`;
            } else {
                systemPrompt = `너는 영어 회화 왕초보인 '${STUDENT_NAME}'을(를) 돕는 친절한 AI 영어 튜터야. 오늘 정해진 주제는 없어. 일반적인 일상 주제(음식, 주말, 취미 등)를 하나 골라서 친근하게 질문하며 대화를 시작해. [중요 규칙]: 사용자가 어색한 영어나 한국어를 쓰면 자연스러운 영어로 고쳐주며 'Can you say [올바른 문장]?' 하고 따라 말하도록 유도해. 항상 아주 쉽고 간단한 1~2문장으로 대답해.`;
            }
            
            chatHistory = [];
            try {
                const response = await fetch(getModelUrl(), {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ "role": "user", "parts": [{ "text": systemPrompt }] }] }) 
                });
                const data = await response.json();
                if (data.error) throw new Error();
                const teacherGreeting = data.candidates[0].content.parts[0].text;
                
                chatHistory = [
                    { "role": "user", "parts": [{ "text": systemPrompt }] },
                    { "role": "model", "parts": [{ "text": teacherGreeting }] }
                ];
                document.getElementById('chatLoading').remove();
                addTeacherMessage(teacherGreeting);
                speakText(teacherGreeting);
            } catch (error) { 
                document.getElementById('chatLoading').innerText = "오류가 발생했습니다. 새로고침 해주세요."; 
            }
        }
    }
    
    // ==========================================
    // 💬 채팅 말풍선 UI 생성
    // ==========================================
    function addTeacherMessage(text) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg', 'teacher-msg'); 
        
        const header = document.createElement('div');
        header.innerText = "🤖 튜터:";
        header.style.fontWeight = "bold";
        header.style.marginBottom = "6px";
        header.style.color = "#d35400";
        
        const textDiv = document.createElement('div');
        textDiv.classList.add('blurred-text');
        textDiv.innerHTML = text; 
        
        const controls = document.createElement('div');
        controls.classList.add('msg-controls');
        
        const replayBtn = document.createElement('button');
        replayBtn.innerHTML = "🔊";
        replayBtn.title = "다시 듣기";
        replayBtn.onclick = function() { replayText(text); };
        
        const showBtn = document.createElement('button');
        showBtn.innerHTML = "👁️";
        showBtn.title = "텍스트 보기/가리기";
        let isBlurred = true;
        showBtn.onclick = function() {
            if (isBlurred) {
                textDiv.classList.remove('blurred-text');
                showBtn.innerHTML = "🙈";
                isBlurred = false;
            } else {
                textDiv.classList.add('blurred-text');
                showBtn.innerHTML = "👁️";
                isBlurred = true;
            }
        };

        const hintBtn = document.createElement('button');
        hintBtn.innerHTML = "📝"; // 튜터용 힌트는 노트 아이콘으로 변경
        hintBtn.title = "문장 해석 및 추천 대답";
        hintBtn.onclick = function() { showHintModal(text); };
        
        controls.appendChild(replayBtn);
        controls.appendChild(showBtn);
        controls.appendChild(hintBtn);
        msgDiv.appendChild(header);
        msgDiv.appendChild(textDiv);
        msgDiv.appendChild(controls);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        
        document.getElementById('studentChatInput').focus();
    }

    // 💡 새로운 💡 토글 아이콘 및 교정 팁 박스 생성
    function addStudentMessage(text) {
        const chatBox = document.getElementById('chatBox');
        
        const wrapper = document.createElement('div');
        wrapper.classList.add('student-msg-wrapper');

        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg', 'student-msg');
        
        const header = document.createElement('div');
        header.innerText = "👤 나:";
        header.style.fontWeight = "bold";
        header.style.marginBottom = "6px";
        header.style.color = "#d35400";

        const textDiv = document.createElement('div');
        textDiv.innerHTML = text.replace(/\n/g, '<br>');
        
        msgDiv.appendChild(header);
        msgDiv.appendChild(textDiv);
        wrapper.appendChild(msgDiv);

        // 컨트롤 박스
        const controls = document.createElement('div');
        controls.classList.add('student-controls');
        
        const tipBtn = document.createElement('button');
        tipBtn.innerHTML = "💡";
        tipBtn.title = "AI 친구의 교정 팁 보기";
        
        const tipBox = document.createElement('div');
        tipBox.classList.add('tip-container');
        tipBox.innerHTML = "⏳ 다정한 친구가 피드백을 적고 있어요...";

        // 토글 애니메이션 로직
        tipBtn.onclick = function() {
            if (tipBox.classList.contains('show')) {
                tipBox.classList.remove('show');
                tipBtn.classList.remove('active');
            } else {
                tipBox.classList.add('show');
                tipBtn.classList.add('active');
            }
            chatBox.scrollTop = chatBox.scrollHeight; 
        };

        controls.appendChild(tipBtn);
        wrapper.appendChild(controls);
        wrapper.appendChild(tipBox);

        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;

        return { tipBox, tipBtn }; 
    }

    // ==========================================
    // 📩 메시지 전송 및 AI 교정/답변 호출
    // ==========================================
    function handleEnter(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault(); 
            sendChatMessage();
        }
    }

    function autoResize(textarea) {
        textarea.style.height = '48px'; 
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px'; 
    }

    async function sendChatMessage() {
        if (CURRENT_HEARTS <= 0) {
            alert("이용 한도를 모두 소진했습니다. 내일 다시 이용해주세요.");
            return;
        }

        const inputEl = document.getElementById('studentChatInput');
        const userText = inputEl.value.trim();
        if (!userText) { alert("답변을 입력해주세요!"); return; }

        CURRENT_HEARTS--;
        localStorage.setItem("gemini_tutor_hearts", CURRENT_HEARTS);
        updateHeartUI();

        // 사용자 말풍선 그리기 (tipBox, tipBtn 객체 받기)
        const { tipBox, tipBtn } = addStudentMessage(userText);
        
        inputEl.value = "";
        if(!inputEl.disabled) inputEl.style.height = '48px';

        chatHistory.push({ "role": "user", "parts": [{ "text": userText }] });
        
        if (chatHistory.length > 7) { 
            const basePrompts = chatHistory.slice(0, 2);
            const recentChats = chatHistory.slice(-5);
            chatHistory = [...basePrompts, ...recentChats];
        }

        const chatBox = document.getElementById('chatBox');
        const typingIndicator = document.createElement('div');
        typingIndicator.id = "typingIndicator";
        typingIndicator.style = "text-align:left; color:#ff9f43; margin:10px; font-weight:bold;";
        typingIndicator.innerText = "🤖 튜터가 답변을 입력 중입니다... ✍️";
        chatBox.appendChild(typingIndicator);
        chatBox.scrollTop = chatBox.scrollHeight;

        // 🌟 수정된 프롬프트: 폭풍 칭찬 및 다정한 제안
        const checkPrompt = `영어 왕초보가 용기를 내서 보낸 메시지야: "${userText}"
틀린 부분을 지적하지 말고, 가장 친한 친구처럼 "오, 의미 전달 완벽해!"라고 먼저 칭찬해 줘. 
그런 뒤에 "이런 표현을 쓰면 원어민처럼 더 자연스러워~"라며 더 나은 문장을 부드럽게 하나만 제안해 줘. 
설명은 다정하고 친근한 말투(해요체 또는 반말)로 한국어 1~2줄 이내로 아주 짧게 써줘. 
만약 문장이 완벽하다면 "우와, 문법도 표현도 흠잡을 데 없어! 진짜 최고야 👏"라고만 대답해.`;

        const grammarFetch = fetch(getModelUrl(), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: checkPrompt }] }] })
        }).then(res => res.json());

        const teacherFetch = fetch(getModelUrl(), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: chatHistory }) 
        }).then(res => res.json());

        try {
            const [grammarData, teacherData] = await Promise.all([grammarFetch, teacherFetch]);
            
            // 교정 팁 업데이트 (반짝이 효과 추가)
            if (grammarData.error) throw new Error(grammarData.error.message);
            const feedbackText = grammarData.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            tipBox.innerHTML = `<strong>💡 AI 친구의 제안:</strong><br>${feedbackText}`;
            tipBtn.innerHTML = "💡✨"; // 완료 아이콘 표시

            // 튜터 답변 업데이트
            if (teacherData.error) throw new Error(teacherData.error.message);
            if(document.getElementById('typingIndicator')) document.getElementById('typingIndicator').remove();
            
            const teacherReply = teacherData.candidates[0].content.parts[0].text;
            chatHistory.push({ "role": "model", "parts": [{ "text": teacherReply }] });
            
            addTeacherMessage(teacherReply);
            speakText(teacherReply); 

        } catch (error) { 
            tipBox.innerHTML = "💡 교정 팁을 불러오지 못했습니다.";
            if(document.getElementById('typingIndicator')) document.getElementById('typingIndicator').remove();
            alert("답변을 처리하는 중 오류가 발생했습니다.");
        }
    }

    // ==========================================
    // 📝 튜터 힌트 팝업 모달
    // ==========================================
    async function showHintModal(teacherText) {
        const modal = document.getElementById('hintModal');
        const modalBody = document.getElementById('hintModalBody');
        
        modal.style.display = "flex";
        modalBody.innerHTML = "⏳ 의미를 파악하고 추천 답변을 생성 중입니다...";
        
        const hintPrompt = `튜터가 한 영어 문장: "${teacherText}"
이 문장을 한국어로 해석해주고, 영어 초보자가 대답할 수 있는 쉽고 짧은 자연스러운 영어 대답 2가지를 추천해줘. 
양식: 
[문장 해석]: (내용)
[추천 대답 1]: (영어) - (뜻)
[추천 대답 2]: (영어) - (뜻)`;
        
        try {
            const response = await fetch(getModelUrl(), {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: hintPrompt }] }] })
            });
            const data = await response.json();
            modalBody.innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
        } catch (error) { 
            modalBody.innerHTML = "정보를 불러오지 못했습니다. 다시 시도해주세요."; 
        }
    }

    function closeHintModal() {
        document.getElementById('hintModal').style.display = "none";
        document.getElementById('studentChatInput').focus();
    }
</script>
