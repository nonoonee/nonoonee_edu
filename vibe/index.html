<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브코딩 마법학교 🧙‍♂️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;700&display=swap');
        body { font-family: 'Nunito', 'Jua', sans-serif; }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 로딩 애니메이션 */
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out;
            fill: #8b5cf6;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
    </style>
</head>
<body class="bg-indigo-50 h-screen overflow-hidden flex text-slate-800">

    <!-- 왼쪽 사이드바: 목차 관리 -->
    <aside class="w-72 bg-white border-r border-indigo-100 flex flex-col shadow-lg z-10 flex-shrink-0 transition-all duration-300 hidden md:flex">
        <div class="p-5 bg-gradient-to-r from-violet-500 to-indigo-500 text-white text-center">
            <h1 class="text-2xl font-bold tracking-wider"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>바이브코딩</h1>
            <p class="text-sm opacity-90 mt-1">나만의 마법 앱 만들기</p>
        </div>
        
        <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-indigo-50">
            <span class="font-bold text-indigo-800"><i class="fa-solid fa-book-open mr-2"></i>수업 목차</span>
            <button onclick="openModal('add')" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-full transition-colors shadow-sm">
                <i class="fa-solid fa-plus mr-1"></i>추가
            </button>
        </div>

        <ul id="curriculum-list" class="flex-1 overflow-y-auto p-3 space-y-2">
            <!-- JS로 렌더링 됨 -->
        </ul>
    </aside>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 flex flex-col md:flex-row min-w-0">
        
        <!-- 중앙: 채팅창 영역 -->
        <section class="flex-1 flex flex-col border-r border-indigo-100 bg-gray-50 max-w-full md:max-w-[50%]">
            <!-- API 키 입력 헤더 -->
            <div class="p-3 bg-white border-b border-gray-200 flex items-center justify-between shadow-sm z-10">
                <div class="flex items-center text-sm font-bold text-slate-700">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix&backgroundColor=c0aede" alt="AI 쌤" class="w-10 h-10 rounded-full mr-3 border-2 border-indigo-200">
                    <span id="current-lesson-title">마법학교에 오신 것을 환영해요!</span>
                </div>
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-key text-gray-400 text-xs"></i>
                    <input type="password" id="api-key" placeholder="Gemini API Key" class="text-xs px-2 py-1.5 border rounded-md w-32 focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-gray-50">
                </div>
            </div>

            <!-- 채팅 기록 -->
            <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- 웰컴 메시지 -->
                <div class="flex items-start">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix&backgroundColor=c0aede" class="w-8 h-8 rounded-full mr-2">
                    <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 max-w-[85%]">
                        <p class="text-sm">안녕, 꼬마 마법사! 왼쪽 목차에서 배우고 싶은 마법을 선택해 봐. 선생님이 마법 주문(프롬프트) 거는 법을 알려줄게! ✨</p>
                    </div>
                </div>
            </div>

            <!-- 로딩 인디케이터 (숨김) -->
            <div id="loading-indicator" class="hidden p-4">
                <div class="flex items-start">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix&backgroundColor=c0aede" class="w-8 h-8 rounded-full mr-2">
                    <div class="bg-white px-4 py-3 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 flex space-x-1 items-center">
                        <svg width="24" height="12" viewBox="0 0 24 12">
                            <circle cx="4" cy="6" r="3" class="typing-dot" />
                            <circle cx="12" cy="6" r="3" class="typing-dot" />
                            <circle cx="20" cy="6" r="3" class="typing-dot" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- 입력 영역 -->
            <div class="bg-white p-4 border-t shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                <!-- 추천 프롬프트 칩 -->
                <div id="hint-chips" class="flex overflow-x-auto space-x-2 mb-3 pb-1 hide-scrollbar">
                    <!-- JS로 렌더링 됨 -->
                </div>
                
                <div class="flex relative">
                    <input type="text" id="chat-input" placeholder="여기에 마법 주문을 적어보세요..." class="flex-1 bg-gray-100 rounded-full pl-5 pr-12 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm" onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()" class="absolute right-2 top-1.5 bottom-1.5 w-9 bg-indigo-500 hover:bg-indigo-600 text-white rounded-full flex items-center justify-center transition-transform hover:scale-105">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 우측: 결과 확인 영역 -->
        <section class="flex-1 flex flex-col bg-white">
            <!-- 탭 헤더 -->
            <div class="flex border-b border-gray-200 bg-gray-50 pt-2 px-2">
                <button onclick="switchTab('preview')" id="tab-preview" class="tab-btn active px-5 py-2.5 text-sm font-bold text-indigo-700 bg-white border-t border-l border-r border-gray-200 rounded-t-lg -mb-px">
                    <i class="fa-solid fa-display mr-2 text-indigo-500"></i>화면보기
                </button>
                <button onclick="switchTab('code')" id="tab-code" class="tab-btn px-5 py-2.5 text-sm font-bold text-gray-500 hover:text-indigo-600 border-t border-l border-r border-transparent rounded-t-lg">
                    <i class="fa-solid fa-code mr-2 text-indigo-500"></i>소스보기
                </button>
                <button onclick="switchTab('logic')" id="tab-logic" class="tab-btn px-5 py-2.5 text-sm font-bold text-gray-500 hover:text-indigo-600 border-t border-l border-r border-transparent rounded-t-lg">
                    <i class="fa-solid fa-diagram-project mr-2 text-indigo-500"></i>생각순서도
                </button>
            </div>

            <!-- 탭 컨텐츠 -->
            <div class="flex-1 relative bg-white">
                <!-- 1. 화면보기 (iframe) -->
                <div id="content-preview" class="absolute inset-0 w-full h-full p-2">
                    <div class="w-full h-full border-2 border-dashed border-gray-300 rounded-xl overflow-hidden bg-white relative">
                        <iframe id="result-iframe" class="w-full h-full" sandbox="allow-scripts allow-modals"></iframe>
                        <div id="iframe-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 bg-gray-50">
                            <i class="fa-solid fa-wand-sparkles text-4xl mb-3 text-indigo-200"></i>
                            <p>주문을 외우면 여기에 마법이 나타나요!</p>
                        </div>
                    </div>
                </div>

                <!-- 2. 소스보기 -->
                <div id="content-code" class="absolute inset-0 w-full h-full hidden p-4 overflow-auto bg-slate-800 text-green-400 font-mono text-sm">
                    <pre><code id="code-block">/* 아직 생성된 코드가 없습니다. */</code></pre>
                </div>

                <!-- 3. 생각순서도 (Mermaid) -->
                <div id="content-logic" class="absolute inset-0 w-full h-full hidden p-4 overflow-auto bg-indigo-50 flex items-center justify-center">
                    <div id="mermaid-container" class="bg-white p-6 rounded-2xl shadow-sm border border-indigo-100 max-w-full text-center">
                        <p class="text-gray-400"><i class="fa-solid fa-project-diagram mb-2 text-2xl"></i><br>코드가 생성되면 순서도가 그려집니다.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 사용자 정의 모달창 (alert, prompt 대체) -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-96 shadow-2xl transform transition-all">
            <h3 id="modal-title" class="text-lg font-bold text-gray-800 mb-2">목차 추가</h3>
            <p id="modal-desc" class="text-sm text-gray-500 mb-4">새로운 마법 수업의 이름을 적어주세요.</p>
            <input type="text" id="modal-input" class="w-full border-2 border-indigo-100 rounded-lg p-2 focus:outline-none focus:border-indigo-400 mb-5" placeholder="예: [완전초급] 도형 그리기">
            <div class="flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-gray-600 bg-gray-100 hover:bg-gray-200 text-sm font-bold">취소</button>
                <button id="modal-confirm-btn" class="px-4 py-2 rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 text-sm font-bold">확인</button>
            </div>
        </div>
    </div>

    <!-- 스크립트: 로직 및 모듈 -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

        // --- 데이터 상태 관리 ---
        const DEFAULT_CURRICULUM = [
            { id: 1, title: "[그림판] 기초 (선 긋기)", hints: ["마우스로 드래그하면 까만 선이 그려지는 그림판을 꽉 차게 만들어줘"] },
            { id: 2, title: "[그림판] 발전 (색깔 버튼)", hints: ["화면 위에 빨강, 파랑, 노랑색으로 펜 색을 바꾸는 버튼 3개를 추가해줘"] },
            { id: 3, title: "[그림판] 완성 (지우개)", hints: ["펜 굵기를 조절하는 슬라이더와 화면을 하얗게 칠하는 지우개 버튼을 만들어줘"] },
            { id: 4, title: "[메모장] 기초 (추가하기)", hints: ["글씨를 쓰는 칸과 등록 버튼을 만들어. 누르면 아래에 글씨가 리스트로 나오게 해줘"] },
            { id: 5, title: "[메모장] 발전 (삭제하기)", hints: ["리스트 옆에 X 버튼을 달아서, 누르면 그 메모가 지워지게 해줘"] },
            { id: 6, title: "[메모장] 완성 (체크박스)", hints: ["체크박스를 달아서 체크하면 취소선이 그어지게 하고, 새로고침해도 안 지워지게 로컬스토리지에 저장해줘"] }
        ];

        let curriculum = [];
        let currentLessonId = null;

        // --- 상태 스냅샷 (State Snapshot) 관리 ---
        function getLessonState(id) {
            const saved = localStorage.getItem(`vibe_lesson_${id}_state`);
            return saved ? JSON.parse(saved) : { html: '', mermaid: '' };
        }

        function saveLessonState(id, html, mermaid) {
            localStorage.setItem(`vibe_lesson_${id}_state`, JSON.stringify({ html, mermaid }));
        }

        // --- 초기화 ---
        function init() {
            const savedData = localStorage.getItem('vibeCurriculum');
            if (savedData) {
                curriculum = JSON.parse(savedData);
            } else {
                curriculum = [...DEFAULT_CURRICULUM];
                saveCurriculum();
            }
            renderCurriculum();
            
            // 전역으로 노출해야 HTML onclick 속성에서 호출 가능
            window.switchTab = switchTab;
            window.sendMessage = sendMessage;
            window.handleKeyPress = handleKeyPress;
            window.useHint = useHint;
            window.loadLesson = loadLesson;
            window.deleteLesson = deleteLesson;
            window.openModal = openModal;
            window.closeModal = closeModal;
        }

        // --- 목차 (커리큘럼) 관리 ---
        function saveCurriculum() {
            localStorage.setItem('vibeCurriculum', JSON.stringify(curriculum));
        }

        function renderCurriculum() {
            const list = document.getElementById('curriculum-list');
            list.innerHTML = '';
            curriculum.forEach(item => {
                const li = document.createElement('li');
                const isActive = item.id === currentLessonId;
                li.className = `group flex justify-between items-center p-3 rounded-xl cursor-pointer transition-colors border ${isActive ? 'bg-indigo-600 text-white border-indigo-700 shadow-md' : 'bg-white text-gray-700 border-gray-100 hover:bg-indigo-50 hover:border-indigo-200'}`;
                
                li.innerHTML = `
                    <div class="flex-1 truncate text-sm font-bold" onclick="loadLesson(${item.id})">
                        <i class="fa-solid ${isActive ? 'fa-wand-magic-sparkles text-yellow-300' : 'fa-graduation-cap text-indigo-400'} w-5"></i>
                        ${item.title}
                    </div>
                    <div class="flex space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="openModal('edit', ${item.id})" class="p-1.5 text-xs rounded-md ${isActive ? 'bg-indigo-500 hover:bg-indigo-400' : 'bg-gray-100 text-gray-500 hover:bg-indigo-100 hover:text-indigo-600'}">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteLesson(${item.id}, event)" class="p-1.5 text-xs rounded-md ${isActive ? 'bg-indigo-500 hover:bg-red-400' : 'bg-gray-100 text-gray-500 hover:bg-red-100 hover:text-red-500'}">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function loadLesson(id) {
            currentLessonId = id;
            const lesson = curriculum.find(l => l.id === id);
            if (!lesson) return;
            
            document.getElementById('current-lesson-title').innerText = lesson.title;
            renderCurriculum(); // 엑티브 상태 업데이트
            
            // 힌트 칩 렌더링
            const hintContainer = document.getElementById('hint-chips');
            hintContainer.innerHTML = '';
            if (lesson.hints && lesson.hints.length > 0) {
                lesson.hints.forEach(hint => {
                    const btn = document.createElement('button');
                    btn.className = "whitespace-nowrap px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-full text-xs font-bold transition-transform hover:scale-105 flex-shrink-0";
                    btn.innerHTML = `<i class="fa-solid fa-lightbulb text-yellow-500 mr-1"></i> ${hint}`;
                    btn.onclick = () => useHint(hint);
                    hintContainer.appendChild(btn);
                });
            }

            // 채팅 리셋 및 환영인사
            const chatHistory = document.getElementById('chat-history');
            chatHistory.innerHTML = '';
            appendMessage('ai', `안녕! <b>${lesson.title}</b> 수업을 시작할게. 아래 마법 주문 버튼을 누르거나 직접 입력해 봐!`);
            
            // 결과창 리셋 또는 불러오기 (State Snapshot 복원)
            const state = getLessonState(id);
            
            if (state.html) {
                document.getElementById('iframe-placeholder').classList.add('hidden');
                document.getElementById('result-iframe').srcdoc = state.html;
                document.getElementById('code-block').innerText = state.html;
            } else {
                document.getElementById('result-iframe').srcdoc = '';
                document.getElementById('iframe-placeholder').classList.remove('hidden');
                document.getElementById('code-block').innerText = '/* 새 주문을 외우면 코드가 생겨요 */';
            }
            
            if (state.mermaid) {
                renderMermaid(state.mermaid);
            } else {
                document.getElementById('mermaid-container').innerHTML = '<p class="text-gray-400"><i class="fa-solid fa-project-diagram mb-2 text-2xl"></i><br>코드가 생성되면 순서도가 그려집니다.</p>';
            }
            
            switchTab('preview');
        }

        function deleteLesson(id, event) {
            event.stopPropagation();
            curriculum = curriculum.filter(l => l.id !== id);
            saveCurriculum();
            if (currentLessonId === id) currentLessonId = null;
            renderCurriculum();
        }

        // --- 모달 관리 (alert/prompt 대체) ---
        let modalAction = null;
        let editTargetId = null;

        function openModal(action, id = null) {
            modalAction = action;
            editTargetId = id;
            const modal = document.getElementById('custom-modal');
            const title = document.getElementById('modal-title');
            const input = document.getElementById('modal-input');
            const btn = document.getElementById('modal-confirm-btn');

            modal.classList.remove('hidden');
            input.value = '';

            if (action === 'add') {
                title.innerText = "새 마법수업 추가";
                input.placeholder = "새로운 수업 이름을 적어주세요.";
                btn.onclick = () => handleModalConfirm();
            } else if (action === 'edit') {
                title.innerText = "마법수업 이름 수정";
                const lesson = curriculum.find(l => l.id === id);
                input.value = lesson ? lesson.title : '';
                btn.onclick = () => handleModalConfirm();
            }
            // Add message modal mode
            else if (action === 'msg') {
                title.innerText = "알림";
                input.classList.add('hidden');
                btn.onclick = closeModal;
            }
            setTimeout(() => input.focus(), 100);
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            document.getElementById('modal-input').classList.remove('hidden');
        }

        function handleModalConfirm() {
            const inputVal = document.getElementById('modal-input').value.trim();
            if (!inputVal) return closeModal();

            if (modalAction === 'add') {
                const newId = curriculum.length > 0 ? Math.max(...curriculum.map(c => c.id)) + 1 : 1;
                curriculum.push({ id: newId, title: inputVal, hints: ["여기에 명령을 적어주세요"] });
            } else if (modalAction === 'edit' && editTargetId) {
                const lesson = curriculum.find(l => l.id === editTargetId);
                if (lesson) lesson.title = inputVal;
            }
            
            saveCurriculum();
            renderCurriculum();
            closeModal();
        }

        function showMessageModal(titleText, descText) {
            document.getElementById('modal-title').innerText = titleText;
            document.getElementById('modal-desc').innerText = descText;
            openModal('msg');
        }

        // --- UI 인터랙션 ---
        function switchTab(tabName) {
            // 버튼 스타일
            ['preview', 'code', 'logic'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tabName) {
                    btn.classList.replace('text-gray-500', 'text-indigo-700');
                    btn.classList.replace('bg-transparent', 'bg-white');
                    btn.classList.add('border-t', 'border-l', 'border-r', 'border-gray-200');
                    btn.classList.remove('border-transparent');
                } else {
                    btn.classList.replace('text-indigo-700', 'text-gray-500');
                    btn.classList.replace('bg-white', 'bg-transparent');
                    btn.classList.remove('border-t', 'border-l', 'border-r', 'border-gray-200');
                    btn.classList.add('border-transparent');
                }
            });

            // 컨텐츠 보이기/숨기기
            document.getElementById('content-preview').classList.toggle('hidden', tabName !== 'preview');
            document.getElementById('content-code').classList.toggle('hidden', tabName !== 'code');
            document.getElementById('content-logic').classList.toggle('hidden', tabName !== 'logic');
        }

        function useHint(text) {
            document.getElementById('chat-input').value = text;
            document.getElementById('chat-input').focus();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(role, text) {
            const chatHistory = document.getElementById('chat-history');
            const div = document.createElement('div');
            div.className = "flex items-start " + (role === 'user' ? "flex-row-reverse" : "");
            
            const avatar = role === 'user' 
                ? `<img src="https://api.dicebear.com/7.x/notionists/svg?seed=Kids" class="w-8 h-8 rounded-full ${role === 'user' ? 'ml-2' : 'mr-2'} bg-yellow-100">`
                : `<img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix&backgroundColor=c0aede" class="w-8 h-8 rounded-full mr-2 border border-indigo-200">`;
            
            const bubbleClasses = role === 'user'
                ? "bg-indigo-500 text-white p-3 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] text-sm"
                : "bg-white text-gray-800 p-3 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 max-w-[85%] text-sm";
                
            div.innerHTML = `
                ${avatar}
                <div class="${bubbleClasses}">${text}</div>
            `;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // --- Gemini API 연동 ---
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            const apiKey = document.getElementById('api-key').value.trim();

            if (!text) return;
            if (!apiKey) {
                showMessageModal("앗!", "우측 상단에 Gemini API Key를 먼저 입력해주세요!");
                return;
            }

            // 사용자 메시지 추가
            appendMessage('user', text);
            input.value = '';
            
            // 로딩 표시
            document.getElementById('loading-indicator').classList.remove('hidden');
            const chatHistoryContainer = document.getElementById('chat-history');
            chatHistoryContainer.scrollTop = chatHistoryContainer.scrollHeight;

            // API 호출 준비 (상태 스냅샷 프롬프트 구성)
            const state = getLessonState(currentLessonId);
            const currentHtml = state.html || "";
            const currentMermaid = state.mermaid || "";

            const systemPrompt = `
넌 11살 초등학생에게 웹 코딩(HTML/CSS/JS)을 가르치는 친절하고 다정한 마법사 AI 선생님 '바이브'야. 
아이들은 네게 자연어로 요구사항을 말할거야 (바이브 코딩).
반드시 JSON 형식으로만 응답해. 백틱(\`\`\`)을 포함한 마크다운 코드블럭으로 감싸지 말고 순수 JSON 문자열만 반환해.

응답 JSON 구조:
{
  "chat": "아이에게 하는 친절한 설명, 칭찬, 그리고 다음 단계 제안 (2~3문장)",
  "html": "요구사항이 반영된 완벽하게 동작하는 단일 HTML 파일 코드 (Tailwind CSS 허용, 스크립트 포함). <html>태그부터 끝까지 모두 작성해.",
  "mermaid": "작성해준 html 코드의 핵심 로직을 표현하는 mermaid.js 문법의 순서도(flowchart TD). 복잡한 설정 없이 기본 문법만 사용해."
}
`;
            
            const userPrompt = `
[현재 소스코드]
${currentHtml || "(아직 작성된 코드가 없습니다. 새로 만들어주세요.)"}

[현재 순서도]
${currentMermaid || "(아직 순서도가 없습니다. 새로 만들어주세요.)"}

[아이의 새로운 명령]
${text}

위 [현재 소스코드]와 [현재 순서도]를 바탕으로 [아이의 새로운 명령]을 반영하여 새로운 html 코드와 mermaid 순서도를 작성해주세요.`;

            const payload = {
                contents: [{ role: "user", parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`API 오류: ${response.status}`);
                
                const result = await response.json();
                const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (jsonText) {
                    const parsed = JSON.parse(jsonText);
                    
                    // 1. 채팅 응답
                    appendMessage('ai', parsed.chat.replace(/\n/g, '<br>'));
                    
                    let updatedHtml = currentHtml;
                    let updatedMermaid = currentMermaid;

                    // 2. 화면 및 소스 업데이트
                    if (parsed.html) {
                        updatedHtml = parsed.html;
                        document.getElementById('iframe-placeholder').classList.add('hidden');
                        document.getElementById('result-iframe').srcdoc = parsed.html;
                        document.getElementById('code-block').innerText = parsed.html;
                    }
                    
                    // 3. 순서도 업데이트
                    if (parsed.mermaid) {
                        updatedMermaid = parsed.mermaid;
                        renderMermaid(parsed.mermaid);
                    }

                    // 4. 상태 저장 (State Snapshot)
                    saveLessonState(currentLessonId, updatedHtml, updatedMermaid);

                } else {
                    appendMessage('ai', "앗, 마법 주문이 꼬여버렸어. 다시 한 번 말해줄래?");
                }
            } catch (error) {
                console.error(error);
                appendMessage('ai', `<span class="text-red-500">마법 통신망에 오류가 발생했어. API Key가 정확한지 확인해줘! (${error.message})</span>`);
            } finally {
                document.getElementById('loading-indicator').classList.add('hidden');
            }
        }

        async function renderMermaid(graphDefinition) {
            const container = document.getElementById('mermaid-container');
            // Clean up backticks if model generated them inside JSON by mistake
            const cleanDef = graphDefinition.replace(/```mermaid\n?/g, '').replace(/```/g, '');
            
            try {
                const { svg } = await mermaid.render('graphDiv-' + Date.now(), cleanDef);
                container.innerHTML = svg;
            } catch (e) {
                container.innerHTML = `<p class="text-red-500"><i class="fa-solid fa-triangle-exclamation mb-2"></i><br>앗, 이번 주문은 순서도로 그리기 조금 복잡했나봐!<br><span class="text-xs text-gray-400">${e.message}</span></p>`;
            }
        }

        // 실행
        window.onload = init;
    </script>
</body>
</html>
